<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pt-bench · compare</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --ink:#1a1d21; --muted:#697079;
    --line:#e6e8ec; --accent:#4f46e5; --a:#4f46e5; --b:#e07b16;
    --good:#16a34a; --bad:#dc2626; --flag:#7c3aed; --chip:#eef0f4; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0e1013; --panel:#16191e; --ink:#e8eaed; --muted:#9aa2ad;
      --line:#262b32; --accent:#7c78f0; --a:#7c78f0; --b:#f0a24a; --good:#4ade80; --bad:#f87171; --flag:#a78bfa;
      --chip:#20242b; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;}
  .wrap{max-width:1180px;margin:0 auto;padding:28px 22px 60px}
  header h1{margin:0;font-size:20px;font-weight:650;letter-spacing:-.01em}
  header p{margin:4px 0 0;color:var(--muted)}
  .pickers{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:22px 0}
  .pick label{display:block;font-size:12px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
  .pick.a label{color:var(--a)} .pick.b label{color:var(--b)}
  select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);color:var(--ink);font-size:14px;appearance:none;cursor:pointer}
  select:focus{outline:2px solid var(--accent);outline-offset:1px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    box-shadow:var(--shadow);padding:18px 18px 16px}
  .overlay{margin-bottom:18px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:760px){.pickers,.cols{grid-template-columns:1fr}}
  h2{margin:0 0 2px;font-size:16px;font-weight:650}
  h3{margin:0 0 10px;font-size:11px;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.05em}
  .card-head{display:flex;align-items:center;gap:10px}
  .del{margin-left:auto;border:1px solid var(--line);background:transparent;color:var(--muted);
    border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;white-space:nowrap}
  .del:hover{border-color:var(--b);color:var(--b)}
  .badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 14px}
  .chip{background:var(--chip);border-radius:999px;padding:3px 9px;font-size:12px;color:var(--muted)}
  .chip.mode{font-weight:600;color:var(--ink)}
  .prov{font-size:12px;color:var(--muted);margin:-6px 0 14px;font-variant-numeric:tabular-nums}
  .prov code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .dirty{color:var(--b)}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .metric{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  .metric .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .metric .v{font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
  .metric .v small{font-size:12px;font-weight:500;color:var(--muted)}
  .metric.wide{grid-column:1/-1;border-color:var(--accent)}
  .metric.wide .k{color:var(--accent)}
  .metric .sub{font-size:11px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 0 16px}
  .toolbar .tb-k{font-size:12px;font-weight:600;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em}
  .toolbar .tb-note{font-size:12px;color:var(--muted)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;background:var(--panel)}
  .seg button{border:0;background:transparent;color:var(--muted);padding:7px 15px;
    font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
  .seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .bars{display:flex;flex-direction:column;gap:7px}
  .bar{display:grid;grid-template-columns:120px 1fr auto;gap:10px;align-items:center;font-size:12px}
  .bar .lbl{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .track{height:8px;border-radius:6px;background:var(--chip);overflow:hidden}
  .bar .fill{display:block;height:100%;border-radius:6px}
  .bar .num{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  .section{margin-top:16px}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .empty{color:var(--muted);text-align:center;padding:40px 0}
  .stops{display:flex;flex-wrap:wrap;gap:6px}
  .stop{border:1px solid var(--line);background:var(--chip);color:var(--ink);
    border-radius:999px;padding:3px 10px;font-size:12px}
  .stop b{font-weight:700}
  .stop.good{border-color:var(--good);color:var(--good)}
  .stop.limit{border-color:var(--b);color:var(--b)}
  .stop.bad{border-color:var(--bad);color:var(--bad)}
  .stop.flag{border-color:var(--flag);color:var(--flag)}
  .stop.neutral{color:var(--muted)}
  svg{display:block;width:100%;height:auto}
  .axis{stroke:var(--line)} .grid{stroke:var(--line);stroke-dasharray:2 4}
  .tick{fill:var(--muted);font-size:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>pt-bench · compare</h1>
    <p>Pick two runs to compare coverage, efficiency, and where the solves came from.</p>
  </header>

  <div class="pickers">
    <div class="pick a"><label>Run A</label><select id="selA"></select></div>
    <div class="pick b"><label>Run B</label><select id="selB"></select></div>
  </div>

  <div class="card overlay" id="overlay" hidden>
    <h3>Coverage at budget</h3>
    <div id="overlayChart"></div>
    <div class="legend">
      <span><i style="background:var(--a)"></i><span id="legA">A</span></span>
      <span><i style="background:var(--b)"></i><span id="legB">B</span></span>
    </div>
  </div>

  <div class="toolbar">
    <span class="tb-k">Findings per</span>
    <div class="seg" id="denom" role="group" aria-label="Findings-per denominator">
      <button type="button" data-d="time" aria-pressed="true">Time</button>
      <button type="button" data-d="tokens" aria-pressed="false">Tokens</button>
      <button type="button" data-d="usd" aria-pressed="false">USD</button>
    </div>
    <span class="tb-note" id="denomNote"></span>
  </div>

  <div class="cols">
    <div id="colA"></div>
    <div id="colB"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const pct = x => x==null ? "–" : (x*100).toFixed(1)+"%";
const num = (x,d=0) => x==null ? "–" : Number(x).toFixed(d);
const short = s => s ? s.slice(0,7) : "–";
const fmtDur = s => {
  if(s==null) return "–";
  s = Math.round(s);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${sec}s` : `${sec}s`;
};
const fmtTok = t => t==null ? "–"
  : t>=1e6 ? (t/1e6).toFixed(2)+"M" : t>=1e3 ? (t/1e3).toFixed(1)+"k" : String(t);
const fmtUsd = x => x==null ? "–" : "$" + (x<1 ? Number(x).toFixed(3) : Number(x).toFixed(2));
const fmtRate = x => (x==null || !isFinite(x)) ? "–"
  : x>=100 ? x.toFixed(0) : x>=10 ? x.toFixed(1) : x.toFixed(2);

// Denominators for findings-per-X. den() returns null when the run carries no
// data for that resource, so the tile degrades to "–" instead of dividing by 0.
const DENOMS = {
  time:   {k:"Findings / hour", note:"solved objectives per hour of wall-clock time",
           den:t=>t.wall==null?null:t.wall/3600, denText:t=>fmtDur(t.wall)},
  tokens: {k:"Findings / 1M tokens", note:"solved objectives per million tokens (in + out)",
           den:t=>t.tokens==null?null:t.tokens/1e6, denText:t=>fmtTok(t.tokens)+" tokens"},
  usd:    {k:"Findings / $", note:"solved objectives per US dollar spent",
           den:t=>t.cost==null?null:t.cost, denText:t=>fmtUsd(t.cost)},
};
let DENOM = "time";

async function jget(u){ const r = await fetch(u); if(!r.ok) throw new Error(u); return r.json(); }

let RUNS = [];
function optionLabel(r){
  const d = (r.started_at||"").replace("T"," ").slice(0,16);
  return `${r.arm} · ${r.scenario} · ${r.mode} · ×${r.repeats} · ${d}  (${pct(r.coverage_mean)})`;
}

function buildOptions(){
  return `<option value="">— select a run —</option>` +
    RUNS.map(r=>`<option value="${r.id}">${optionLabel(r)}</option>`).join("");
}

async function boot(){
  RUNS = await jget("/api/runs");
  $("#selA").innerHTML = $("#selB").innerHTML = buildOptions();
  if(RUNS[0]) $("#selA").value = RUNS[0].id;
  if(RUNS[1]) $("#selB").value = RUNS[1].id;
  $("#selA").onchange = refresh; $("#selB").onchange = refresh;
  for(const btn of document.querySelectorAll("#denom button")){
    btn.onclick = () => { DENOM = btn.dataset.d; renderCards(); };
  }
  refresh();
}

async function reloadRuns(){
  RUNS = await jget("/api/runs");
  const opts = buildOptions();
  for(const sel of [$("#selA"),$("#selB")]){
    const cur = sel.value;
    sel.innerHTML = opts;
    sel.value = RUNS.some(r=>r.id===cur) ? cur : "";  // keep selection if it survives
  }
}

window.deleteRun = async (id) => {
  if(!confirm(`Delete this run permanently?\n\n${id}\n\nThis removes it from disk and cannot be undone.`)) return;
  const r = await fetch("/api/runs/" + id, {method:"DELETE"});
  if(!r.ok){ alert("Delete failed (HTTP " + r.status + ")"); return; }
  await reloadRuns();
  await refresh();
};

let DETAIL = {A:null,B:null};
async function refresh(){
  const ida = $("#selA").value, idb = $("#selB").value;
  DETAIL.A = ida ? await jget("/api/runs/"+ida) : null;
  DETAIL.B = idb ? await jget("/api/runs/"+idb) : null;
  renderCards();
  renderOverlay();
}

function renderCards(){
  for(const btn of document.querySelectorAll("#denom button"))
    btn.setAttribute("aria-pressed", String(btn.dataset.d === DENOM));
  $("#denomNote").textContent = DENOMS[DENOM].note;
  $("#colA").innerHTML = DETAIL.A ? renderCard(DETAIL.A,"a") : emptyCard();
  $("#colB").innerHTML = DETAIL.B ? renderCard(DETAIL.B,"b") : emptyCard();
}

function emptyCard(){ return `<div class="card"><div class="empty">No run selected.</div></div>`; }

// mean of by_X ratio maps across a batch's rows -> [{label,ratio,solved,total}]
function aggBy(rows, key){
  const acc = {};
  for(const r of rows){
    const m = (r.coverage||{})[key] || {};
    for(const k in m){
      const c = acc[k] || (acc[k]={r:0,s:0,t:0,n:0});
      c.r+=m[k].ratio; c.s+=m[k].solved; c.t+=m[k].total; c.n++;
    }
  }
  return Object.entries(acc).map(([label,c])=>({
    label, ratio:c.n?c.r/c.n:0, solved:Math.round(c.s/(c.n||1)), total:Math.round(c.t/(c.n||1))
  }));
}

// Batch totals over completed repetitions only, so the findings-per-X numerator
// and denominator cover the same runs (the badges show completed / total).
// A resource stays null unless at least one repetition reported it.
function totals(rows){
  const ok = rows.filter(r => r.status === "completed");
  const t = {n:ok.length, n_rows:rows.length, solved:0,
             tokens_in:null, tokens_out:null, tokens:null, cost:null, wall:null};
  const add = (k,v) => { if(v!=null) t[k] = (t[k]||0) + v; };
  for(const r of ok){
    t.solved += (r.coverage||{}).solved || 0;
    const e = r.efficiency || {};
    add("tokens_in", e.tokens_in); add("tokens_out", e.tokens_out);
    add("cost", e.cost_usd);       add("wall", e.wall_time_s);
  }
  if(t.tokens_in!=null || t.tokens_out!=null) t.tokens = (t.tokens_in||0) + (t.tokens_out||0);
  return t;
}

function bars(items, color, sortByTotal){
  if(!items.length) return `<div class="empty">no data</div>`;
  items.sort((a,b)=> sortByTotal ? b.total-a.total : (a.label.localeCompare(b.label,undefined,{numeric:true})));
  return `<div class="bars">` + items.map(it=>`
    <div class="bar">
      <span class="lbl" title="${it.label}">${it.label}</span>
      <span class="track"><span class="fill" style="width:${(it.ratio*100).toFixed(1)}%;background:var(--${color})"></span></span>
      <span class="num">${(it.ratio*100).toFixed(0)}% · ${it.solved}/${it.total}</span>
    </div>`).join("") + `</div>`;
}

function metric(k,v,opts={}){
  return `<div class="metric${opts.cls?" "+opts.cls:""}"><div class="k">${k}</div>` +
    `<div class="v">${v}</div>${opts.sub?`<div class="sub">${opts.sub}</div>`:""}</div>`;
}

// The findings-per-X tile for one run, under the currently selected denominator.
function perTile(t){
  const D = DENOMS[DENOM], den = D.den(t);
  const rate = (den!=null && den>0) ? t.solved/den : null;
  const scope = t.n===t.n_rows ? "" : ` · ${t.n}/${t.n_rows} completed runs`;
  const sub = den==null ? "no data for this denominator"
    : `${t.solved} findings / ${D.denText(t)}${scope}`;
  return metric(D.k, fmtRate(rate), {cls:"wide", sub});
}

// Human labels + colour tone per stop-reason code (see cli._classify_stop).
const STOP_META = {
  agent_completed:{label:"Agent finished", tone:"good"},
  all_solved:     {label:"All findings solved", tone:"good"},
  plateau:        {label:"Plateau — no new solves", tone:"neutral"},
  max_iterations: {label:"Max iterations", tone:"neutral"},
  budget_wall:    {label:"Wall-time limit", tone:"limit"},
  budget_tokens:  {label:"Token limit", tone:"limit"},
  budget_usd:     {label:"USD limit", tone:"limit"},
  budget:         {label:"Budget limit", tone:"limit"},
  refused:        {label:"Safety refusal", tone:"flag"},
  error:          {label:"Error", tone:"bad"},
  unknown:        {label:"Unknown", tone:"neutral"},
};
const STATUS_FALLBACK = {completed:"agent_completed", refused:"refused", budget_exceeded:"budget", error:"error"};

// Stop-reason histogram for a run: prefer the aggregated summary, fall back to
// the per-repetition rows (older summaries predate stop_reasons).
function stopReasons(detail){
  const s = detail.summary||{};
  if(s.stop_reasons && Object.keys(s.stop_reasons).length) return s.stop_reasons;
  const acc = {};
  for(const r of (detail.rows||[])){
    const c = (r.stop_reason&&r.stop_reason.code) || STATUS_FALLBACK[r.status] || "unknown";
    acc[c] = (acc[c]||0) + 1;
  }
  return acc;
}

function stopChips(detail){
  const counts = stopReasons(detail);
  const codes = Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
  if(!codes.length) return `<div class="empty">no data</div>`;
  const total = codes.reduce((n,c)=>n+counts[c],0);
  return `<div class="stops">` + codes.map(c=>{
    const m = STOP_META[c] || {label:c, tone:"neutral"};
    const cnt = total>1 ? ` <b>×${counts[c]}</b>` : "";
    return `<span class="stop ${m.tone}" title="${m.label}">${m.label}${cnt}</span>`;
  }).join("") + `</div>`;
}

function renderCard(detail, color){
  const m = detail.manifest||{}, s = detail.summary||{}, rows = detail.rows||[];
  const g = m.git||{}, pb = g.pt_bench||{}, ar = g.agent_repo||{};
  const ci = s.coverage_ci95_halfwidth;
  const cov = `${pct(s.coverage_mean)} <small>${ci?("± "+(ci*100).toFixed(1)):""}</small>`;
  const cab = s.coverage_at_budget_mean;
  const prov = `<span class="prov">
      ${(m.started_at||"").replace("T"," ")} ·
      pt-bench <code>${short(pb.sha)}</code>${pb.dirty?'<span class="dirty"> ✎</span>':''}${
      ar.sha?` · agent <code>${short(ar.sha)}</code>${ar.dirty?'<span class="dirty"> ✎</span>':''}`:''}
    </span>`;
  const t = totals(rows);
  return `<div class="card">
    <div class="card-head">
      <h2>${m.arm||"?"}</h2>
      <button class="del" onclick="deleteRun('${detail.id}')">Delete</button>
    </div>
    <div class="badges">
      <span class="chip mode">${m.mode||""}</span>
      <span class="chip">${m.scenario||""}</span>
      ${m.model?`<span class="chip">${m.model}</span>`:""}
      <span class="chip">${s.n_completed??0}/${s.n_runs??0} runs</span>
    </div>
    ${prov}
    <div class="metrics">
      ${metric("Coverage", cov)}
      ${metric("Weighted", pct(s.coverage_weighted_mean))}
      ${metric("Iterations", num(s.iterations_mean,1))}
      ${metric("First solve", s.first_solve_s_mean!=null?num(s.first_solve_s_mean,0)+"s":"–")}
      ${metric("Cost / run", s.cost_usd_mean!=null?"$"+num(s.cost_usd_mean,2):"–")}
      ${metric("Tool calls", num(s.tool_calls_mean,0))}
      ${metric("Total time", fmtDur(t.wall))}
      ${metric("Total tokens", fmtTok(t.tokens),
               {sub: t.tokens==null?"" : `${fmtTok(t.tokens_in)} in · ${fmtTok(t.tokens_out)} out`})}
      ${metric("Total cost", fmtUsd(t.cost))}
      ${perTile(t)}
    </div>
    <div class="section"><h3>Why it stopped</h3>${stopChips(detail)}</div>
    <div class="section"><h3>Coverage at budget</h3>${lineChart([series(cab,color)], color)}</div>
    <div class="section"><h3>By category</h3>${bars(aggBy(rows,"by_category"), color, true)}</div>
    <div class="section"><h3>By difficulty</h3>${bars(aggBy(rows,"by_difficulty"), color, false)}</div>
  </div>`;
}

// coverage_at_budget_mean {"0.25":r,...} -> series points incl. origin
function series(cab, color){
  const pts = [{x:0,y:0}];
  if(cab) for(const k of Object.keys(cab).sort((a,b)=>+a-+b)) pts.push({x:+k*100, y:cab[k]});
  return {color, points:pts};
}

function lineChart(seriesList, colorHint){
  const W=520,H=170,P={l:38,r:12,t:12,b:26};
  const iw=W-P.l-P.r, ih=H-P.t-P.b;
  let ymax = 0; seriesList.forEach(s=>s.points.forEach(p=>ymax=Math.max(ymax,p.y)));
  ymax = ymax>0 ? ymax*1.15 : 1;
  const X = x => P.l + (x/100)*iw;
  const Y = y => P.t + ih - (y/ymax)*ih;
  const grid = [0,25,50,75,100].map(gx=>`<line class="grid" x1="${X(gx)}" y1="${P.t}" x2="${X(gx)}" y2="${P.t+ih}"/>`).join("");
  const xticks = [0,25,50,75,100].map(gx=>`<text class="tick" x="${X(gx)}" y="${H-8}" text-anchor="middle">${gx}%</text>`).join("");
  const yt=[0,ymax/2,ymax].map(gy=>`<text class="tick" x="${P.l-6}" y="${Y(gy)+3}" text-anchor="end">${(gy*100).toFixed(0)}%</text>`).join("");
  const lines = seriesList.map(s=>{
    const d = s.points.map((p,i)=>`${i?"L":"M"}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(" ");
    const dots = s.points.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3" fill="var(--${s.color})"/>`).join("");
    return `<path d="${d}" fill="none" stroke="var(--${s.color})" stroke-width="2.2" stroke-linejoin="round"/>${dots}`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img">
    ${grid}
    <line class="axis" x1="${P.l}" y1="${P.t+ih}" x2="${W-P.r}" y2="${P.t+ih}"/>
    <line class="axis" x1="${P.l}" y1="${P.t}" x2="${P.l}" y2="${P.t+ih}"/>
    ${yt}${xticks}${lines}
  </svg>`;
}

function renderOverlay(){
  const A=DETAIL.A, B=DETAIL.B, box=$("#overlay");
  if(!A && !B){ box.hidden=true; return; }
  box.hidden=false;
  const sl=[];
  if(A) sl.push(series((A.summary||{}).coverage_at_budget_mean,"a"));
  if(B) sl.push(series((B.summary||{}).coverage_at_budget_mean,"b"));
  $("#overlayChart").innerHTML = lineChart(sl);
  $("#legA").textContent = A ? `A · ${A.manifest.arm} (${A.manifest.mode})` : "A";
  $("#legB").textContent = B ? `B · ${B.manifest.arm} (${B.manifest.mode})` : "B";
}

boot().catch(e=>{ document.querySelector(".wrap").innerHTML =
  `<div class="empty">Failed to load results: ${e.message}. Is the server running and are there any runs yet?</div>`; });
</script>
</body>
</html>
