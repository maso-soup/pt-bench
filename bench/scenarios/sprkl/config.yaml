# SPRKL scenario defaults. Override any key from an arm's `scenario_config`, or
# per-run with --scenario-config KEY=VALUE.
#
# SPRKL v2.0.1 split into two images: the attackable storefront (`sprkl-app`) and
# the scorer (`sprkl-scorer`) that fronts it as an ingress proxy and owns the
# rules, catalog and scoring key. Pin EXACT tags so the finding set is frozen
# across runs — never :latest. The app image carries no answer key at all now
# (rules/catalog/key live only in the scorer, which the agent cannot reach); the
# scenario still verifies the app image is clean before running.
app_image: "ghcr.io/maso-soup/sprkl-app:v2.0.1"
scorer_image: "ghcr.io/maso-soup/sprkl-scorer:v2.0.1"
port: 8080                # AGENT-facing storefront port (the scorer's ingress
                          # proxy). The score API is published only to loopback on
                          # a random per-run port.
ready_timeout_s: 120
progress_interval_s: 5    # how often to poll solved-state for live progress
category_field: family    # `family` (11 coarse OWASP-ish buckets) or `category`
                          # (~40 fine-grained). Drives the grader's by_category.
# oracle_key: optional fixed X-Oracle-Key for debugging; random per-run if unset.
