# Baseline control: Opus 4.8 with NO pentest scaffolding.
# Same adapter, model, task prompt, and budget as pt-agent__opus-4.8 — the only
# difference is that the claude-code adapter runs in an empty working directory
# (baselines/flat-prompt/) so no CLAUDE.md/AGENTS.md/skills/hooks load.
# The coverage/efficiency gap vs pt-agent__opus-4.8 measures what the scaffolding
# is worth. Keep every non-scaffolding field identical to that arm.
name: flat-prompt__opus-4.8
adapter: claude-code
model: claude-opus-4-8
adapter_config:
  repo: baselines/flat-prompt  # relative to the pt-bench root; resolved by the runner
  skip_permissions: true       # match the pt-agent arm for a fair unattended run
  # Clear Claude Code's per-project memory between repetitions so it can't read
  # back a prior run's notes. 
  reset_paths:
    - ~/.claude/projects
    - ~/.local/share/pt-bench/baselines/flat-prompt
budget:
  # All three caps are hard: the claude-code adapter stops the run when any is hit
  # (tokens/USD from the streamed usage, wall time in-loop), and the runner enforces
  # wall time as a subprocess backstop and totals every cap across max-coverage
  # continuation iterations.
  usd: 15                      # enforced: stops when cumulative cost exceeds this
  tokens: 10000000             # enforced: stops when total (input+output) tokens exceed this
  wall_time_s: 1800            # enforced: adapter in-loop + runner backstop
