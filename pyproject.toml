[project]
name = "pt-bench"
version = "0.1.0"
description = "Modular benchmark for agentic penetration-testing agents"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "PyYAML>=6.0",
    "Flask>=3.0",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.0", "pytest>=8.0"]

[project.scripts]
pt-bench-dashboard = "dashboard.app:main"

[tool.setuptools.packages.find]
include = ["bench*", "dashboard*"]

[tool.setuptools.package-data]
dashboard = ["static/*"]
